name: 기능 제안
description: FlowCraft를 더 유용하게 만들 아이디어를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        구현 방법보다 먼저 어떤 문제를 해결하려는지 알려주세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 점이 어렵거나 불편한가요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방식
      description: 원하는 사용자 흐름이나 동작을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: 기대 효과
      description: 사용자나 AI 작업 흐름에 어떤 도움이 되나요?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 기존 Issue에 비슷한 제안이 없는지 확인했습니다.
          required: true
        - label: 실제 에이전트 실행기가 아니라 계획 설계 도구라는 제품 범위를 고려했습니다.
          required: true
