name: 버그 제보
description: 재현 가능한 문제를 알려주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 사용자 프롬프트, 인증 정보와 개인 데이터는 제거해 주세요.
  - type: dropdown
    id: area
    attributes:
      label: 문제가 발생한 영역
      options:
        - 작업 요청과 설계 프롬프트
        - JSON 가져오기
        - 작업 흐름 캔버스
        - 작업 편집기
        - Markdown·이미지 내보내기
        - 브라우저 저장·복원
        - 모바일·접근성
        - 기타
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
      description: 어떤 문제가 발생했는지 간단히 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 사용 환경
      placeholder: "예: macOS 15, Safari 19 / Windows 11, Chrome 140"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 민감정보를 제거한 화면이나 최소 JSON이 있다면 첨부해 주세요.
  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: 기존 Issue에 같은 문제가 없는지 확인했습니다.
          required: true
        - label: 사용자 데이터와 인증 정보를 제거했습니다.
          required: true
